services:
  network-dashboard:
    image: ghcr.io/planner77/network_dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TSDB_PATH=/app/tsdb_data/network_telemetry.db
    volumes:
      - tsdb_data:/app/tsdb_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tsdb_data:
    driver: local
