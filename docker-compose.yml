services:
  network-dashboard:
    image: ghcr.io/planner77/network_dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DASHBOARD_PORT:-9921}:9921"
    environment:
      - PORT=9921
      - DASHBOARD_PORT=9921
      - TSDB_PATH=/app/tsdb_data/network_telemetry.db
    volumes:
      - tsdb_data:/app/tsdb_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9921/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tsdb_data:
    driver: local
